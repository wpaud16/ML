name: steward sync (드라이브 경제/Steward 업로드)

# 브리핑 시스템 파일·매뉴얼을 구글드라이브 '경제/Steward' 에 올림 (2026-11-05). 매뉴얼·코드가 바뀌면 자동 갱신.
on:
  workflow_dispatch:
  # push 자동 실행은 꺼 둠: 구글 인증이 drive.readonly 라 업로드 403 (2026-11-05). 쓰기 권한 재발급 후 다시 켤 것

permissions:
  contents: write

concurrency:
  group: steward-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Upload
        working-directory: brief
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: python3 steward_sync.py
      - name: Save log
        if: always()
        run: |
          git config user.name "steward-bot"; git config user.email "actions@users.noreply.github.com"
          git add brief/steward_sync.log; git diff --cached --quiet && exit 0
          git commit -m "steward: 업로드 기록"; for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
