name: auction predictions (daily)

# 매일 새벽 03:40 KST(전날 18:40 UTC)에 (2026-11-03: GitHub 예약 실행이 몇 시간씩 밀려 07:45 브리핑 전에 못 끝난 날이 있어 앞당김) 경매 낙찰가 예측을 미리 계산해 auction_model/predictions/latest.json 에 저장.
# 아침 브리핑(07:45 KST)은 이 파일만 읽는다.
on:
  # 2026-11-05: GitHub 예약 실행이 5~8시간 밀리거나 빠지는 날이 있어 KST 21:17·23:17·01:17·03:17 네 번 걸고,
  # 그날(18시 이후는 다음 날) 결과가 이미 있으면 건너뛴다. 결과 날짜 규칙은 batch_predict.py 의 day.
  # 2026-11-08: 노트북(LAPTOP-M47J0JTR) 03:00 통합 실행이 주 실행 → 이 예약은 예비로 KST 06:07·07:07 (결과 있으면 건너뜀)
  # 2026-11-08 밤: 주 예비는 backup.yml(10분마다 노트북 상태 확인 → 바로 실행). 아래는 그것도 밀릴 때의 마지막 안전망 KST 07:07
  schedule:
    - cron: '7 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auction_model/auction_predictor.py'
      - 'auction_model/batch_predict.py'
      - 'auction_model/cards_page.py'
      - 'auction_model/villa_log.py'
      - 'auction_model/officetel_model.py'
      - 'auction_model/auction_config.json'
      - 'auction_model/fail_model.py'
      - 'auction_model/fail_config.json'
      - 'auction_model/auction_train.csv'
      - 'auction_model/molit.py'
      - 'auction_model/nearby.py'
      - '.github/workflows/auction_predict.yml'

permissions:
  contents: write

concurrency:
  group: auction-predict
  cancel-in-progress: true   # 2026-11-05: 새 코드 push 시 이전 실행 취소 (결과는 마지막 코드 기준만 필요)

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          day=$(TZ=Asia/Seoul date -d '+6 hours' +%F)
          git fetch -q --depth=1 origin main
          have=$(git show origin/main:auction_model/predictions/latest.json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin).get('date'))" || true)
          echo "target=$day have=$have event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$have" = "$day" ]; then echo "skip=1" >> $GITHUB_OUTPUT; fi

  predict:
    needs: check
    if: needs.check.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -q numpy pandas scikit-learn
      - name: Predict
        working-directory: auction_model
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python batch_predict.py
      - name: Cards page (경매 전체 카드 웹페이지, 2026-11-04~)
        working-directory: auction_model
        continue-on-error: true
        run: python cards_page.py
      - name: Villa log (서울 빌라 경매 기록, 2026-11-02~)
        working-directory: auction_model
        continue-on-error: true
        run: python villa_log.py
      - name: Commit results
        run: |
          git config user.name "auction-bot"
          git config user.email "actions@users.noreply.github.com"
          git add auction_model/predictions auction_model/page auction_model/molit_cache auction_model/danji_map.json auction_model/villa auction_model/officetel
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "auction: 예측 결과 $(TZ=Asia/Seoul date +%F)"
          # 다른 실행과 결과 파일이 겹치면 이번 실행(최신 계산) 결과를 우선한다
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "push failed"; exit 1
