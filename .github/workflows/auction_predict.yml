name: auction predictions (daily)

# 매일 새벽 06:10 KST(전날 21:10 UTC)에 경매 낙찰가 예측을 미리 계산해 auction_model/predictions/latest.json 에 저장.
# 아침 브리핑(07:45 KST)은 이 파일만 읽는다.
on:
  schedule:
    - cron: '10 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auction_model/auction_predictor.py'
      - 'auction_model/batch_predict.py'
      - 'auction_model/auction_config.json'
      - 'auction_model/auction_train.csv'
      - '.github/workflows/auction_predict.yml'

permissions:
  contents: write

concurrency:
  group: auction-predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -q numpy pandas scikit-learn
      - name: Predict
        working-directory: auction_model
        run: python batch_predict.py
      - name: Commit results
        run: |
          git config user.name "auction-bot"
          git config user.email "actions@users.noreply.github.com"
          git add auction_model/predictions auction_model/danji_map.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "auction: 예측 결과 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            sleep 5
          done
