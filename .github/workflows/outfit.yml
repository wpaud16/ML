name: outfit (아침 날씨·코디)

# 매일 05:47 KST(20:47 UTC). Claude 예약 작업 "아침 날씨·코디 브리핑"을 대신하는 Python 버전 (2026-11-05~).
# 코드 수정 push 로 실행되면 제목에 [테스트].
on:
  # 2026-11-05: 예약 실행 지연 대비 KST 04:13·05:13·06:13·07:13 네 번, 오늘 메일 보냈으면(sent.txt) 건너뜀
  # 2026-11-08: 노트북 06:00 통합 실행이 주 실행 → 예비로 KST 07:13·08:13 (sent.txt 있으면 건너뜀)
  schedule:
    - cron: '13 22 * * *'
    - cron: '13 23 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'outfit/run_outfit.py'
      - 'outfit/weather.py'
      - 'outfit/looks.py'
      - '.github/workflows/outfit.yml'

permissions:
  contents: write

concurrency:
  group: outfit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          git fetch -q --depth=1 origin main
          if [ "${{ github.event_name }}" = "schedule" ] && git cat-file -e origin/main:outfit/$(TZ=Asia/Seoul date +%F)/sent.txt 2>/dev/null; then echo "이미 보냄"; echo "skip=1" >> $GITHUB_OUTPUT; fi

  outfit:
    needs: check
    if: needs.check.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          pip install -q playwright pillow
          python -m playwright install --with-deps chromium > /dev/null
      - name: Outfit
        working-directory: outfit
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # push 실행은 [테스트], 단 커밋 메시지에 [실행] 이 있으면 실제 메일 (예약 실행이 밀렸을 때 수동 발송용)
          TEST_MODE: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '[실행]') && '1' || '0' }}
        run: python run_outfit.py
      - name: Commit page
        if: always()
        run: |
          git config user.name "outfit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outfit/20*/
          git diff --cached --quiet && exit 0
          git commit -m "outfit: $(TZ=Asia/Seoul date +%F) 코디 카드"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
      - name: Send mail (페이지 반영 1~2분 대기 후)
        if: always()
        working-directory: outfit
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          [ -f .skip ] && exit 0
          sleep 90
          python run_outfit.py send
      - name: Commit sent mark (하루 1통)
        if: success()
        run: |
          git add outfit/20*/sent.txt 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "outfit: $(TZ=Asia/Seoul date +%F) 메일 발송 기록"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 10; done
