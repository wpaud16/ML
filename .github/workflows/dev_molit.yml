name: dev molit (국토부 실거래 수집, 시세 백테스트용)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auction_model/dev/molit_collect.py'
      - 'auction_model/dev/molit_mode.txt'
      - '.github/workflows/dev_molit.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pandas
      - name: Collect
        working-directory: auction_model/dev
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
        run: python molit_collect.py $(cat molit_mode.txt)
      - name: Commit
        if: always()
        run: |
          git config user.name "dev-bot"
          git config user.email "actions@users.noreply.github.com"
          git add auction_model/dev/molit
          git diff --cached --quiet && exit 0
          git commit -m "dev: 국토부 실거래 수집 결과"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 10; done
