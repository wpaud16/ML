name: pages (웹페이지만 배포)

# 저장소 전체(150MB+) 대신 웹페이지 파일만 배포 → 10분 시간초과 실패 방지
# 필요 설정: Settings > Pages > Source = "GitHub Actions" (아니면 배포 건너뜀, 실패 메일 없음)
on:
  push:
    branches: [main]
    paths:
      - 'auction_model/page/**'
      - 'outfit/**'
      - 'events/**'
      - 'privacy.html'
      - '.github/workflows/pages.yml'
  workflow_run:
    # GITHUB_TOKEN 으로 push한 커밋은 push 트리거를 깨우지 않으므로 끝난 뒤 배포
    workflows:
      - 'auction predictions (daily)'
      - 'auction model retrain (monthly)'
      - 'outfit (아침 날씨·코디)'
      - 'morning brief (JM''s Schedule)'
      - 'backup (노트북 예비 실행 감시)'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Pages 설정 확인
        id: cfg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api repos/${{ github.repository }}/pages --jq .build_type 2>/dev/null || echo none)
          echo "build_type=$t"
          echo "ok=$([ "$t" = workflow ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == '1'
        with:
          ref: main
          sparse-checkout: |
            auction_model/page
            outfit
            events
            privacy.html
          sparse-checkout-cone-mode: false

      - name: 사이트 폴더 구성
        if: steps.cfg.outputs.ok == '1'
        run: |
          mkdir -p _site/auction_model
          cp -r auction_model/page _site/auction_model/page
          rsync -a --exclude='*.py' outfit/ _site/outfit/
          cp -r events _site/events 2>/dev/null || true   # 응모 이벤트·지역 행사 (2026-11-18)
          cp privacy.html _site/ 2>/dev/null || true
          touch _site/.nojekyll
          du -sh _site

      - uses: actions/upload-pages-artifact@v3
        if: steps.cfg.outputs.ok == '1'
        with:
          path: _site

      # 2026-11-21: 업로드 직후 배포가 'No artifacts named github-pages' 로 가끔 실패 (GitHub 쪽 지연)
      # → 기다렸다 최대 3번 시도. 그래도 안 되면 실패 메일 대신 경고만 (다음 배포 때 최신 페이지가 올라감)
      - uses: actions/deploy-pages@v4
        id: d1
        if: steps.cfg.outputs.ok == '1'
        continue-on-error: true

      - name: 재시도 대기
        if: steps.cfg.outputs.ok == '1' && steps.d1.outcome == 'failure'
        run: sleep 30

      - uses: actions/deploy-pages@v4
        id: d2
        if: steps.cfg.outputs.ok == '1' && steps.d1.outcome == 'failure'
        continue-on-error: true

      - name: 재시도 대기 2
        if: steps.cfg.outputs.ok == '1' && steps.d2.outcome == 'failure'
        run: sleep 90

      - uses: actions/deploy-pages@v4
        id: d3
        if: steps.cfg.outputs.ok == '1' && steps.d2.outcome == 'failure'
        continue-on-error: true

      - name: 배포 실패 경고 (메일 없음)
        if: steps.d3.outcome == 'failure'
        run: echo "::warning::Pages 배포 3번 실패 — 다음 배포 때 다시 올라감"
