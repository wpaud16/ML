name: morning brief (JM's Schedule)

# 매일 07:45 KST(22:45 UTC) 아침 브리핑 메일. Claude 예약 작업을 대신하는 Python 버전 (2026-11-04~).
# 2026-11-05 정식 전환(TEST_MODE=0): 매일 JM's Schedule 문서에 오늘 섹션 생성·이월 후 메일.
on:
  # 2026-11-05: 예약 실행 지연 대비 KST 04:23·05:23·06:23·07:23 네 번, 오늘 보냈으면(brief/sent/날짜.txt) 건너뜀
  # 2026-11-08: 노트북 08:00 통합 실행이 주 실행 → 예비로 KST 09:23·10:23 (brief/sent/날짜.txt 있으면 건너뜀)
  # 2026-11-08 밤: 주 예비는 backup.yml(10분마다 노트북 상태 확인 → 바로 실행). 아래는 그것도 밀릴 때의 마지막 안전망 KST 10:23
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:   # 수동 발송용: brief/trigger.txt 수정 push → 바로 실행 (2026-11-05)
    branches: [main]
    paths:
      - 'brief/trigger.txt'

permissions:
  contents: write

concurrency:
  group: morning-brief
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.c.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        run: |
          git fetch -q --depth=1 origin main
          if [ "${{ github.event_name }}" = "schedule" ] && git cat-file -e origin/main:brief/sent/$(TZ=Asia/Seoul date +%F).txt 2>/dev/null; then echo "이미 보냄"; echo "skip=1" >> $GITHUB_OUTPUT; fi

  brief:
    needs: check
    if: needs.check.outputs.skip != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        continue-on-error: true
        run: pip install -q anthropic
      - name: Brief
        working-directory: brief
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 2026-11-05 정식 전환(0): 문서에 오늘 섹션 생성·이월. 단 push 커밋 메시지에 [테스트] 가 있으면 예시 메일(문서 읽기만, 제목 [테스트])
          TEST_MODE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[테스트]') && '1' || '0' }}
        run: python run_brief.py
      - name: Commit sent mark (하루 1통)
        run: |
          git config user.name "brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add brief/sent
          git diff --cached --quiet && exit 0
          git commit -m "brief: $(TZ=Asia/Seoul date +%F) 메일 발송 기록"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0; sleep 10; done
