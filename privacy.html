<h1>개인정보처리방침 (jm-brief)</h1>
<p>jm-brief는 소유자 본인(1인)만 사용하는 개인용 자동화 도구입니다. 본인의 Google 계정에서 지정된 문서·시트를 읽고 수정하며, 본인에게 아침 브리핑 메일을 보냅니다.</p>
<p>수집한 데이터는 제3자에게 제공·판매하지 않으며, 브리핑 작성 외의 목적으로 사용하지 않습니다. 인증 정보는 GitHub 암호화 저장소(Secrets)에만 보관합니다.</p>
